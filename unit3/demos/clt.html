<div class="demo" id="demo-clt">
  <div class="demo-label">Interactive demo</div>
  <h4>The CLT in action: standardized sums approach Normal(0,1)</h4>
  <div class="demo-controls">
    <label>underlying distribution of $X_i$:
      <select id="clt-dist">
        <option value="bernoulli">Bernoulli(0.2)</option>
        <option value="skewed" selected>{1,2,3} skewed</option>
        <option value="uniform">Uniform(0,1)</option>
      </select>
    </label>
  </div>
  <div class="demo-controls">
    <label>N = <input id="clt-n" type="range" min="1" max="50" step="1" value="5"><span id="clt-n-val">5</span></label>
    <button id="clt-draw1">Draw 1 sum</button>
    <button id="clt-draw500">Draw 500 sums</button>
    <button id="clt-reset">Reset</button>
  </div>
  <svg id="clt-chart"></svg>
</div>

<script>
(function () {
  const distSel = document.getElementById('clt-dist');
  const nSlider = document.getElementById('clt-n');
  const nVal = document.getElementById('clt-n-val');
  const chart = document.getElementById('clt-chart');

  const dists = {
    bernoulli: { name: 'Bernoulli(0.2)', mu: 0.2, sigma2: 0.16, sample: () => NotesUtils.bernoulli(0.2) },
    skewed: {
      name: '{1,2,3} skewed', mu: 5 / 3, sigma2: 5 / 9,
      sample: () => {
        const u = Math.random();
        const vals = [1, 2, 3], probs = [0.5, 1 / 3, 1 / 6];
        let acc = 0;
        for (let i = 0; i < vals.length; i++) { acc += probs[i]; if (u < acc) return vals[i]; }
        return vals[vals.length - 1];
      },
    },
    uniform: { name: 'Uniform(0,1)', mu: 0.5, sigma2: 1 / 12, sample: () => Math.random() },
  };

  let zValues = [];

  function N() { return parseInt(nSlider.value, 10); }
  function dist() { return dists[distSel.value]; }

  function drawOne() {
    const d = dist(), n = N();
    let s = 0;
    for (let i = 0; i < n; i++) s += d.sample();
    zValues.push((s - n * d.mu) / Math.sqrt(n * d.sigma2));
  }

  function render() {
    const XMIN = -4, XMAX = 4, NBINS = 32;
    const binW = (XMAX - XMIN) / NBINS;
    const counts = new Array(NBINS).fill(0);
    zValues.forEach((z) => {
      if (z < XMIN || z >= XMAX) return;
      counts[Math.min(NBINS - 1, Math.floor((z - XMIN) / binW))]++;
    });
    const bins = counts.map((c, i) => ({
      x0: XMIN + i * binW,
      x1: XMIN + (i + 1) * binW,
      density: zValues.length ? c / (zValues.length * binW) : 0,
    }));
    NotesUtils.histWithCurve(chart, {
      bins,
      curve: (x) => NotesUtils.normalPdf(x, 0, 1),
      xDomain: [XMIN, XMAX],
      xTicks: [-3, -2, -1, 0, 1, 2, 3].map((x) => ({ x, label: String(x) })),
      legend: [{ name: 'standardized sum', color: '#1f5a6b' }, { name: 'Normal(0,1)', color: '#b08a2a' }],
    });
  }

  document.getElementById('clt-draw1').addEventListener('click', () => { drawOne(); render(); });
  document.getElementById('clt-draw500').addEventListener('click', () => { for (let i = 0; i < 500; i++) drawOne(); render(); });
  document.getElementById('clt-reset').addEventListener('click', () => { zValues = []; render(); });
  nSlider.addEventListener('input', () => { nVal.textContent = N(); zValues = []; render(); });
  distSel.addEventListener('change', () => { zValues = []; render(); });

  render();
})();
</script>
