<div class="demo" id="demo-biasvar">
  <div class="demo-label">Interactive demo</div>
  <h4>Bias and variance: two datasets, same true function</h4>
  <div class="demo-controls">
    <label>polynomial degree $K$ = <input id="bv-k" type="range" min="1" max="10" step="1" value="2"><span id="bv-k-val">2</span></label>
    <label>$\sigma$ = <input id="bv-sigma" type="range" min="0.1" max="1" step="0.05" value="0.4"><span id="bv-sigma-val">0.40</span></label>
    <button id="bv-newdata">New datasets</button>
  </div>
  <svg id="bv-chart"></svg>
</div>

<script>
(function () {
  const mk = NotesUtils.svg;
  const kSlider = document.getElementById('bv-k');
  const sigmaSlider = document.getElementById('bv-sigma');
  const kVal = document.getElementById('bv-k-val');
  const sigmaVal = document.getElementById('bv-sigma-val');
  const chart = document.getElementById('bv-chart');

  const N = 14, X_LO = -1.5, X_HI = 1.5;
  let X = [], epsA = [], epsB = [];

  function trueF(x) { return 1.2 * Math.sin(2.6 * x) + 0.5 * x; }

  function k() { return parseInt(kSlider.value, 10); }
  function sigma() { return parseFloat(sigmaSlider.value); }

  function genData() {
    X = Array.from({ length: N }, (_, i) => X_LO + ((X_HI - X_LO) * i) / (N - 1));
    epsA = X.map(() => NotesUtils.gaussianRandom(0, 1));
    epsB = X.map(() => NotesUtils.gaussianRandom(0, 1));
  }

  function render() {
    const kk = k(), s = sigma();
    const YA = X.map((x, i) => trueF(x) + s * epsA[i]);
    const YB = X.map((x, i) => trueF(x) + s * epsB[i]);
    const fitA = NotesUtils.polyFit(X, YA, kk);
    const fitB = NotesUtils.polyFit(X, YB, kk);

    const xDomain = [X_LO - 0.2, X_HI + 0.2];
    const yVals = YA.concat(YB);
    const yDomain = [Math.min(...yVals) - 0.7, Math.max(...yVals) + 0.7];
    const width = 480, height = 300, margin = { top: 12, right: 12, bottom: 30, left: 36 };
    const innerW = width - margin.left - margin.right, innerH = height - margin.top - margin.bottom;
    NotesUtils.clear(chart);
    chart.setAttribute('viewBox', `0 0 ${width} ${height}`);
    chart.setAttribute('width', '100%');
    const g = mk('g', { transform: `translate(${margin.left},${margin.top})` });
    chart.appendChild(g);
    const xToPx = (x) => ((x - xDomain[0]) / (xDomain[1] - xDomain[0])) * innerW;
    const yToPxRaw = (y) => innerH - ((y - yDomain[0]) / (yDomain[1] - yDomain[0])) * innerH;
    const clampPx = (v) => Math.max(-1000, Math.min(2000, v));
    const yToPx = (y) => clampPx(yToPxRaw(y));
    g.appendChild(mk('line', { x1: 0, y1: innerH, x2: innerW, y2: innerH, stroke: '#9b9e91' }));
    g.appendChild(mk('line', { x1: 0, y1: 0, x2: 0, y2: innerH, stroke: '#9b9e91' }));

    const nPts = 100;
    function curvePath(evalFn) {
      return Array.from({ length: nPts + 1 }, (_, i) => {
        const x = xDomain[0] + ((xDomain[1] - xDomain[0]) * i) / nPts;
        return `${i === 0 ? 'M' : 'L'} ${xToPx(x).toFixed(1)} ${yToPx(evalFn(x)).toFixed(1)}`;
      }).join(' ');
    }

    g.appendChild(mk('path', { d: curvePath(trueF), fill: 'none', stroke: '#2b2e27', 'stroke-width': 1.5, 'stroke-dasharray': '5,4' }));
    g.appendChild(mk('path', { d: curvePath((x) => NotesUtils.polyEval(fitA, x)), fill: 'none', stroke: '#1f5a6b', 'stroke-width': 2 }));
    g.appendChild(mk('path', { d: curvePath((x) => NotesUtils.polyEval(fitB, x)), fill: 'none', stroke: '#a2542c', 'stroke-width': 2 }));

    X.forEach((x, i) => {
      g.appendChild(mk('circle', { cx: xToPx(x), cy: yToPx(YA[i]), r: 3, fill: '#1f5a6b', opacity: 0.8 }));
      g.appendChild(mk('circle', { cx: xToPx(x), cy: yToPx(YB[i]), r: 3, fill: '#a2542c', opacity: 0.8 }));
    });

    // marker at x=0 showing how far apart the two fits are there
    const x0 = 0;
    const predA0 = NotesUtils.polyEval(fitA, x0), predB0 = NotesUtils.polyEval(fitB, x0);
    const px0 = xToPx(x0);
    const pyA = yToPx(predA0), pyB = yToPx(predB0);
    g.appendChild(mk('line', { x1: px0, y1: 0, x2: px0, y2: innerH, stroke: '#babdb0', 'stroke-width': 1, 'stroke-dasharray': '3,3' }));
    g.appendChild(mk('line', { x1: px0, y1: pyA, x2: px0, y2: pyB, stroke: '#565a4e', 'stroke-width': 3 }));
    [[pyA, '#1f5a6b'], [pyB, '#a2542c']].forEach(([py, color]) => {
      g.appendChild(mk('circle', { cx: px0, cy: py, r: 4, fill: color, stroke: '#fff', 'stroke-width': 1.2 }));
    });
    g.appendChild(mk('circle', { cx: px0, cy: yToPx(trueF(x0)), r: 3.2, fill: 'none', stroke: '#2b2e27', 'stroke-width': 1.5 }));
  }

  document.getElementById('bv-newdata').addEventListener('click', () => { genData(); render(); });
  [kSlider, sigmaSlider].forEach((s) => s.addEventListener('input', () => {
    kVal.textContent = k();
    sigmaVal.textContent = sigma().toFixed(2);
    render();
  }));

  genData();
  render();
})();
</script>
