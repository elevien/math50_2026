<div class="demo" id="demo-joint">
  <div class="demo-label">Interactive demo</div>
  <h4>Joint, marginal, and conditional probabilities</h4>
  <div class="demo-controls">
    <button id="joint-regen">Regenerate table</button>
    <label><input type="checkbox" id="joint-indep-check"> compare each cell to $P(Y_A)\,P(Y_B)$ (independence check)</label>
  </div>
  <div class="demo-controls">
    condition on:
    <button class="cond-btn" data-cond="none">none</button>
    <button class="cond-btn" data-cond="0">$Y_B=0$</button>
    <button class="cond-btn" data-cond="1">$Y_B=1$</button>
  </div>
  <table class="prob-table" id="joint-table"></table>
</div>

<script>
(function () {
  let P = { 0: { 0: 0.5, 1: 0.125 }, 1: { 0: 0.125, 1: 0.25 } };
  const table = document.getElementById('joint-table');
  const indepCheck = document.getElementById('joint-indep-check');
  let cond = 'none';

  function randomJoint() {
    const D = [8, 12, 16][Math.floor(Math.random() * 3)];
    let remaining = D;
    const counts = [];
    for (let i = 0; i < 3; i++) {
      const maxTake = remaining - (3 - i);
      const take = 1 + Math.floor(Math.random() * maxTake);
      counts.push(take);
      remaining -= take;
    }
    counts.push(remaining);
    for (let i = counts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [counts[i], counts[j]] = [counts[j], counts[i]];
    }
    return { 0: { 0: counts[0] / D, 1: counts[1] / D }, 1: { 0: counts[2] / D, 1: counts[3] / D } };
  }

  function rowSum(a) { return P[a][0] + P[a][1]; }
  function colSum(b) { return P[0][b] + P[1][b]; }
  function fmt(x) { return x.toFixed(3); }

  function render() {
    table.innerHTML = '';
    const showIndep = indepCheck.checked;

    const header = document.createElement('tr');
    ['', 'Y_B = 0', 'Y_B = 1', 'P(Y_A)'].forEach((h) => {
      const th = document.createElement('th'); th.textContent = h; header.appendChild(th);
    });
    table.appendChild(header);

    [0, 1].forEach((a) => {
      const tr = document.createElement('tr');
      const th = document.createElement('th'); th.textContent = 'Y_A = ' + a; tr.appendChild(th);
      [0, 1].forEach((b) => {
        const td = document.createElement('td');
        td.textContent = fmt(P[a][b]);
        if (showIndep) {
          const indepVal = rowSum(a) * colSum(b);
          const small = document.createElement('div');
          small.style.fontSize = '0.75em';
          small.style.color = Math.abs(indepVal - P[a][b]) < 0.01 ? '#6e7f4a' : '#a2542c';
          small.textContent = 'P·P = ' + fmt(indepVal);
          td.appendChild(small);
        }
        if (cond !== 'none' && Number(cond) === b) {
          td.style.background = '#f7edd4';
          const cs = colSum(b);
          const small = document.createElement('div');
          small.style.fontSize = '0.75em';
          small.style.color = '#8a6a1c';
          small.textContent = 'conditional: ' + fmt(P[a][b] / cs);
          td.appendChild(small);
        }
        tr.appendChild(td);
      });
      const marg = document.createElement('td'); marg.textContent = fmt(rowSum(a)); marg.style.fontWeight = '700';
      tr.appendChild(marg);
      table.appendChild(tr);
    });

    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.textContent = 'P(Y_B)'; tr.appendChild(th);
    [0, 1].forEach((b) => {
      const td = document.createElement('td'); td.textContent = fmt(colSum(b)); td.style.fontWeight = '700';
      if (cond !== 'none' && Number(cond) === b) td.style.background = '#f7edd4';
      tr.appendChild(td);
    });
    const total = document.createElement('td'); total.textContent = '1.000'; total.style.fontWeight = '700';
    tr.appendChild(total);
    table.appendChild(tr);

  }

  document.querySelectorAll('.cond-btn').forEach((btn) => {
    btn.addEventListener('click', () => { cond = btn.dataset.cond; render(); });
  });
  indepCheck.addEventListener('change', render);
  document.getElementById('joint-regen').addEventListener('click', () => { P = randomJoint(); cond = 'none'; render(); });
  render();
})();
</script>
