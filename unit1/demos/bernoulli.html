<div class="demo" id="demo-bernoulli">
  <div class="demo-label">Interactive demo</div>
  <h4>Simulate Bernoulli random variable</h4>
  <div class="demo-controls">
    <label>true probability $q$ = <input id="bern-q" type="range" min="0.05" max="0.95" step="0.05" value="0.6"><span id="bern-q-val">0.60</span></label>
    <button id="bern-draw1">Draw one</button>
    <button id="bern-draw100">Draw 100</button>
    <button id="bern-reset">Reset</button>
    <span class="demo-value">$n$ = <span id="bern-n">0</span>, $\hat p$ = <span id="bern-phat">&mdash;</span></span>
  </div>
  <svg id="bern-chart"></svg>
</div>

<script>
(function () {
  const mk = NotesUtils.svg;
  const qSlider = document.getElementById('bern-q');
  const qVal = document.getElementById('bern-q-val');
  const nOut = document.getElementById('bern-n');
  const pOut = document.getElementById('bern-phat');
  const chart = document.getElementById('bern-chart');

  const W = 520, H = 240, m = { top: 14, right: 16, bottom: 30, left: 34 };
  const innerW = W - m.left - m.right, innerH = H - m.top - m.bottom;

  let samples = [];

  const q = () => parseFloat(qSlider.value);

  function draw(k) {
    for (let i = 0; i < k; i++) samples.push(NotesUtils.bernoulli(q()));
  }

  function text(x, y, str, attrs) {
    const t = mk('text', Object.assign({ x, y, 'font-size': 10, fill: '#7c7f72' }, attrs || {}));
    t.textContent = str;
    return t;
  }

  function render() {
    qVal.textContent = q().toFixed(2);
    nOut.textContent = samples.length;
    pOut.textContent = samples.length
      ? (samples.reduce((a, b) => a + b, 0) / samples.length).toFixed(3)
      : '—';

    NotesUtils.clear(chart);
    chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
    chart.setAttribute('width', '100%');
    const g = mk('g', { transform: `translate(${m.left},${m.top})` });
    chart.appendChild(g);

    const yToPx = (v) => innerH - v * innerH;
    const n = samples.length;
    const xMax = Math.max(20, n);
    const xToPx = (i) => (i / xMax) * innerW;

    // axes
    g.appendChild(mk('line', { x1: 0, y1: innerH, x2: innerW, y2: innerH, stroke: '#9b9e91' }));
    g.appendChild(mk('line', { x1: 0, y1: 0, x2: 0, y2: innerH, stroke: '#9b9e91' }));
    [0, 1].forEach((v) => {
      g.appendChild(mk('line', { x1: -4, y1: yToPx(v), x2: 0, y2: yToPx(v), stroke: '#9b9e91' }));
      g.appendChild(text(-8, yToPx(v) + 3, String(v), { 'text-anchor': 'end' }));
    });
    g.appendChild(text(innerW / 2, innerH + 22, 'draw number', { 'text-anchor': 'middle' }));

    // the true probability, as a reference line between the two outcome rows
    const qy = yToPx(q());
    g.appendChild(mk('line', {
      x1: 0, y1: qy, x2: innerW, y2: qy,
      stroke: '#b08a2a', 'stroke-width': 1.4, 'stroke-dasharray': '4,3',
    }));
    g.appendChild(text(innerW, qy - 5, 'q = ' + q().toFixed(2), {
      'text-anchor': 'end', fill: '#8a6a1c', 'font-weight': 700,
    }));

    // one dot per draw, at its value 0 or 1
    const r = n > 400 ? 1.3 : n > 150 ? 1.9 : 2.6;
    const op = n > 400 ? 0.35 : n > 150 ? 0.5 : 0.75;
    samples.forEach((v, i) => {
      g.appendChild(mk('circle', {
        cx: xToPx(i), cy: yToPx(v), r: r,
        fill: '#1f5a6b', opacity: op,
      }));
    });

    // running sample frequency
    if (n > 1) {
      let run = 0;
      const d = samples.map((v, i) => {
        run += v;
        return `${i === 0 ? 'M' : 'L'} ${xToPx(i)} ${yToPx(run / (i + 1))}`;
      }).join(' ');
      g.appendChild(mk('path', { d, fill: 'none', stroke: '#a2542c', 'stroke-width': 1.8 }));
      g.appendChild(text(innerW, yToPx(samples.reduce((a, b) => a + b, 0) / n) + 14, 'p̂', {
        'text-anchor': 'end', fill: '#a2542c', 'font-weight': 700,
      }));
    }
  }

  qSlider.addEventListener('input', render);
  document.getElementById('bern-draw1').addEventListener('click', () => { draw(1); render(); });
  document.getElementById('bern-draw100').addEventListener('click', () => { draw(100); render(); });
  document.getElementById('bern-reset').addEventListener('click', () => { samples = []; render(); });

  render();
})();
</script>
