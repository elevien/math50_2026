<div class="demo" id="demo-sampledist2">
  <div class="demo-label">Interactive demo</div>
  <h4>The data seen along $u$ and $v$</h4>
  <div class="demo-controls">
    <label>$\text{corr}(X_1,X_2)$ = <input id="sd2-rho" type="range" min="-0.95" max="0.95" step="0.05" value="0.9"><span id="sd2-rho-val" class="demo-value">0.90</span></label>
    <button id="sd2-new">New dataset</button>
    <button id="sd2-many">+20 datasets</button>
    <button id="sd2-reset">Clear</button>
  </div>
  <svg id="sd2-chart"></svg>
  <div class="demo-controls">
    <span>spread of $u$: <span id="sd2-su" class="demo-value">&mdash;</span></span>
    <span>spread of $v$: <span id="sd2-sv" class="demo-value">&mdash;</span></span>
    <span>se of slope along $u$: <span id="sd2-seu" class="demo-value">&mdash;</span></span>
    <span>along $v$: <span id="sd2-sev" class="demo-value">&mdash;</span></span>
  </div>
</div>

<script>
(function () {
  const mk = NotesUtils.svg;
  const B1 = 1, B2 = 0.5, SIGMA = 1, N = 50, KEEP = 40;
  const DATA = '#1f5a6b', RUST = '#a2542c', GOLD = '#b08a2a', AXIS = '#9b9e91', LABEL = '#7c7f72', GRID = '#efebe2';
  const S2 = Math.SQRT2;
  const rhoSlider = document.getElementById('sd2-rho');
  const chart = document.getElementById('sd2-chart');
  let current = null;   // latest dataset: {X1, X2, Y, fit}
  let fits = [];        // earlier fits, for the faint lines

  const rho = () => parseFloat(rhoSlider.value);

  function fit(X1, X2, Y) {
    const n = Y.length, m1 = NotesUtils.mean(X1), m2 = NotesUtils.mean(X2), my = NotesUtils.mean(Y);
    let s11 = 0, s22 = 0, s12 = 0, c1 = 0, c2 = 0;
    for (let i = 0; i < n; i++) {
      const d1 = X1[i] - m1, d2 = X2[i] - m2, dy = Y[i] - my;
      s11 += d1 * d1; s22 += d2 * d2; s12 += d1 * d2; c1 += d1 * dy; c2 += d2 * dy;
    }
    const det = s11 * s22 - s12 * s12;
    const b1 = (c1 * s22 - c2 * s12) / det, b2 = (c2 * s11 - c1 * s12) / det;
    return { b0: my - b1 * m1 - b2 * m2, b1, b2 };
  }

  function newDataset() {
    const r = rho(), X1 = [], X2 = [], Y = [];
    for (let i = 0; i < N; i++) {
      const z1 = NotesUtils.gaussianRandom(0, 1), z2 = NotesUtils.gaussianRandom(0, 1);
      const x1 = z1, x2 = r * z1 + Math.sqrt(1 - r * r) * z2;
      X1.push(x1); X2.push(x2); Y.push(B1 * x1 + B2 * x2 + NotesUtils.gaussianRandom(0, SIGMA));
    }
    if (current) fits.push(current.fit);
    if (fits.length > KEEP) fits.shift();
    current = { X1, X2, Y, fit: fit(X1, X2, Y) };
  }

  function text(g, x, y, s, attrs) {
    const t = mk('text', Object.assign({ x, y, 'font-size': 15, fill: LABEL, 'text-anchor': 'middle' }, attrs || {}));
    t.textContent = s;
    g.appendChild(t);
  }

  // one panel of y vs. a projected coordinate (u or v), shared fixed axes
  function viewPanel(g, size, coord, slopeOf, title, trueSlope) {
    const XR = 3.5, YR = 5;
    const px = (v) => ((v + XR) / (2 * XR)) * size, py = (v) => size - ((v + YR) / (2 * YR)) * size;
    const clipId = 'sd2-clip-' + title.charAt(0);
    const clip = mk('clipPath', { id: clipId });
    clip.appendChild(mk('rect', { x: 0, y: 0, width: size, height: size }));
    g.appendChild(clip);
    g.appendChild(mk('rect', { x: 0, y: 0, width: size, height: size, fill: 'none', stroke: AXIS }));
    const inner = mk('g', { 'clip-path': `url(#${clipId})` });
    g.appendChild(inner);
    inner.appendChild(mk('line', { x1: px(0), y1: 0, x2: px(0), y2: size, stroke: GRID }));
    const line = (f, attrs) => {
      const s = slopeOf(f);
      inner.appendChild(mk('line', Object.assign({ x1: px(-XR), y1: py(f.b0 - s * XR), x2: px(XR), y2: py(f.b0 + s * XR) }, attrs)));
    };
    fits.forEach((f) => line(f, { stroke: DATA, 'stroke-width': 1, opacity: 0.25 }));
    inner.appendChild(mk('line', { x1: px(-XR), y1: py(-trueSlope * XR), x2: px(XR), y2: py(trueSlope * XR), stroke: GOLD, 'stroke-width': 1.6, 'stroke-dasharray': '5,3' }));
    if (current) {
      current.Y.forEach((yv, i) => inner.appendChild(mk('circle', { cx: px(coord(current.X1[i], current.X2[i])), cy: py(yv), r: 2.4, fill: DATA, opacity: 0.65 })));
      line(current.fit, { stroke: RUST, 'stroke-width': 2.2 });
    }
    [-3, 0, 3].forEach((v) => text(g, px(v), size + 15, String(v), { 'font-size': 13 }));
    text(g, size / 2, size + 32, title);
    text(g, -12, size / 2, 'Y');
  }

  function render() {
    const W = 700, H = 290, top = 10, size = 200, gap = 32;
    NotesUtils.clear(chart);
    chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
    chart.setAttribute('width', '100%');

    // ---------- panel 1: predictors with the u and v directions ----------
    const g1 = mk('g', { transform: `translate(26,${top})` });
    chart.appendChild(g1);
    const R = 3.5, px = (v) => ((v + R) / (2 * R)) * size, py = (v) => size - ((v + R) / (2 * R)) * size;
    g1.appendChild(mk('rect', { x: 0, y: 0, width: size, height: size, fill: 'none', stroke: AXIS }));
    g1.appendChild(mk('line', { x1: px(-R), y1: py(-R), x2: px(R), y2: py(R), stroke: '#6b6e62', 'stroke-width': 1.2 }));
    g1.appendChild(mk('line', { x1: px(-R), y1: py(R), x2: px(R), y2: py(-R), stroke: '#6b6e62', 'stroke-width': 1.2, 'stroke-dasharray': '4,3' }));
    text(g1, px(2.7), py(3.05), 'u', { fill: '#3a3a34', 'font-size': 16, 'font-style': 'italic' });
    text(g1, px(2.7), py(-2.65), 'v', { fill: '#3a3a34', 'font-size': 16, 'font-style': 'italic' });
    if (current) current.X1.forEach((x1, i) => {
      const x2 = current.X2[i];
      if (Math.abs(x1) < R && Math.abs(x2) < R) g1.appendChild(mk('circle', { cx: px(x1), cy: py(x2), r: 2.4, fill: DATA, opacity: 0.7 }));
    });
    text(g1, size / 2, size + 18, 'X₁');
    text(g1, -14, size / 2, 'X₂');

    // ---------- panels 2 and 3: Y along u and along v ----------
    const g2 = mk('g', { transform: `translate(${26 + size + gap},${top})` });
    chart.appendChild(g2);
    viewPanel(g2, size, (a, b) => (a + b) / S2, (f) => (f.b1 + f.b2) / S2, 'u = (X₁+X₂)/√2', (B1 + B2) / S2);
    const g3 = mk('g', { transform: `translate(${26 + 2 * (size + gap)},${top})` });
    chart.appendChild(g3);
    viewPanel(g3, size, (a, b) => (a - b) / S2, (f) => (f.b1 - f.b2) / S2, 'v = (X₁−X₂)/√2', (B1 - B2) / S2);

    // ---------- readouts ----------
    if (current) {
      const U = current.X1.map((a, i) => (a + current.X2[i]) / S2), V = current.X1.map((a, i) => (a - current.X2[i]) / S2);
      document.getElementById('sd2-su').textContent = Math.sqrt(NotesUtils.variance(U)).toFixed(2);
      document.getElementById('sd2-sv').textContent = Math.sqrt(NotesUtils.variance(V)).toFixed(2);
    }
    const all = fits.concat(current ? [current.fit] : []);
    const sdOf = (arr) => (arr.length > 2 ? Math.sqrt(NotesUtils.variance(arr)).toFixed(3) : '—');
    document.getElementById('sd2-seu').textContent = sdOf(all.map((f) => (f.b1 + f.b2) / S2));
    document.getElementById('sd2-sev').textContent = sdOf(all.map((f) => (f.b1 - f.b2) / S2));
  }

  document.getElementById('sd2-new').addEventListener('click', () => { newDataset(); render(); });
  document.getElementById('sd2-many').addEventListener('click', () => { for (let i = 0; i < 20; i++) newDataset(); render(); });
  document.getElementById('sd2-reset').addEventListener('click', () => { fits = []; newDataset(); fits = []; render(); });
  rhoSlider.addEventListener('input', () => {
    document.getElementById('sd2-rho-val').textContent = rho().toFixed(2);
    fits = []; current = null; newDataset(); render();
  });

  for (let i = 0; i < 15; i++) newDataset();
  render();
})();
</script>
