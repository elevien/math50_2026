<div class="demo" id="demo-sampledist">
  <div class="demo-label">Interactive demo</div>
  <h4>The joint sample distribution of $(\hat\beta_1,\hat\beta_2)$</h4>
  <div class="demo-controls">
    <label>$\text{corr}(X_1,X_2)$ = <input id="sd-rho" type="range" min="-0.95" max="0.95" step="0.05" value="0"><span id="sd-rho-val" class="demo-value">0.00</span></label>
    <label>$N$ = <input id="sd-n" type="range" min="10" max="200" step="10" value="50"><span id="sd-n-val" class="demo-value">50</span></label>
    <button id="sd-play">Play</button>
    <button id="sd-add">+100 replicates</button>
    <button id="sd-reset">Reset</button>
  </div>
  <svg id="sd-chart"></svg>
  <div class="demo-controls">
    <span>replicates: <span id="sd-count" class="demo-value">0</span></span>
    <span>$\text{se}(\hat\beta_1)$: <span id="sd-se1" class="demo-value">&mdash;</span></span>
    <span>$\text{se}(\hat\beta_1+\hat\beta_2)$: <span id="sd-sesum" class="demo-value">&mdash;</span></span>
    <span>$\text{se}(\hat\beta_1-\hat\beta_2)$: <span id="sd-sediff" class="demo-value">&mdash;</span></span>
  </div>
</div>

<script>
(function () {
  const mk = NotesUtils.svg;
  const B1 = 1, B2 = 0.5, SIGMA = 1;          // true coefficients and noise sd
  const RANGE = 1.5;                           // fixed half-width of the coefficient axes
  const DATA = '#1f5a6b', RUST = '#a2542c', GOLD = '#b08a2a', AXIS = '#9b9e91', LABEL = '#7c7f72', GRID = '#efebe2';

  const rhoSlider = document.getElementById('sd-rho');
  const nSlider = document.getElementById('sd-n');
  const chart = document.getElementById('sd-chart');
  const playBtn = document.getElementById('sd-play');
  let est = [];          // {b1, b2} for each replicate
  let lastX = null;      // predictors of the most recent replicate
  let timer = null;

  const rho = () => parseFloat(rhoSlider.value);
  const N = () => parseInt(nSlider.value, 10);

  // standardized predictors with correlation rho
  function drawX(n, r) {
    const X1 = [], X2 = [];
    for (let i = 0; i < n; i++) {
      const z1 = NotesUtils.gaussianRandom(0, 1), z2 = NotesUtils.gaussianRandom(0, 1);
      X1.push(z1); X2.push(r * z1 + Math.sqrt(1 - r * r) * z2);
    }
    return { X1, X2 };
  }

  // least squares with an intercept, two predictors
  function fit(X1, X2, Y) {
    const n = Y.length, m1 = NotesUtils.mean(X1), m2 = NotesUtils.mean(X2), my = NotesUtils.mean(Y);
    let s11 = 0, s22 = 0, s12 = 0, c1 = 0, c2 = 0;
    for (let i = 0; i < n; i++) {
      const d1 = X1[i] - m1, d2 = X2[i] - m2, dy = Y[i] - my;
      s11 += d1 * d1; s22 += d2 * d2; s12 += d1 * d2; c1 += d1 * dy; c2 += d2 * dy;
    }
    const det = s11 * s22 - s12 * s12;
    return { b1: (c1 * s22 - c2 * s12) / det, b2: (c2 * s11 - c1 * s12) / det };
  }

  function addReplicate() {
    const { X1, X2 } = drawX(N(), rho());
    const Y = X1.map((x1, i) => B1 * x1 + B2 * X2[i] + NotesUtils.gaussianRandom(0, SIGMA));
    est.push(fit(X1, X2, Y));
    lastX = { X1, X2 };
  }

  // theory: beta_hat ~ Normal(beta, sigma^2/N * Sigma^{-1}), Sigma = [[1, rho], [rho, 1]]
  function theory() {
    const r = rho(), n = N(), c = SIGMA * SIGMA / (n * (1 - r * r));
    return {
      se1: Math.sqrt(c),
      seSum: Math.sqrt(2 * SIGMA * SIGMA / (n * (1 + r))),
      seDiff: Math.sqrt(2 * SIGMA * SIGMA / (n * (1 - r))),
    };
  }

  function text(g, x, y, s, attrs) {
    const t = mk('text', Object.assign({ x, y, 'font-size': 15, fill: LABEL, 'text-anchor': 'middle' }, attrs || {}));
    t.textContent = s;
    g.appendChild(t);
  }

  function render() {
    const W = 700, H = 312, top = 22, size = 220, gap = 30;
    const left1 = 30, left2 = left1 + size + gap + 10, left3 = left2 + size + gap;
    const w3 = W - left3 - 8;
    NotesUtils.clear(chart);
    chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
    chart.setAttribute('width', '100%');
    const th = theory();

    // ---------- panel 1: the predictors of the latest replicate ----------
    const g1 = mk('g', { transform: `translate(${left1},${top})` });
    chart.appendChild(g1);
    const px = (v) => ((v + 3.2) / 6.4) * size, py = (v) => size - ((v + 3.2) / 6.4) * size;
    g1.appendChild(mk('rect', { x: 0, y: 0, width: size, height: size, fill: 'none', stroke: AXIS }));
    g1.appendChild(mk('line', { x1: px(-3.2), y1: py(-3.2), x2: px(3.2), y2: py(3.2), stroke: GRID }));
    g1.appendChild(mk('line', { x1: px(-3.2), y1: py(3.2), x2: px(3.2), y2: py(-3.2), stroke: GRID }));
    if (lastX) lastX.X1.forEach((x1, i) => {
      const x2 = lastX.X2[i];
      if (Math.abs(x1) < 3.2 && Math.abs(x2) < 3.2) g1.appendChild(mk('circle', { cx: px(x1), cy: py(x2), r: 2.4, fill: DATA, opacity: 0.7 }));
    });
    text(g1, size / 2, size + 18, 'X₁');
    text(g1, -16, size / 2, 'X₂');
    text(g1, size / 2, -6, 'predictors, latest replicate', { 'font-size': 15, fill: '#3a3a34' });

    // ---------- panel 2: joint cloud of (b1_hat, b2_hat), fixed axes ----------
    const g2 = mk('g', { transform: `translate(${left2},${top})` });
    chart.appendChild(g2);
    const bx = (v) => ((v - (B1 - RANGE)) / (2 * RANGE)) * size;
    const by = (v) => size - ((v - (B2 - RANGE)) / (2 * RANGE)) * size;
    const clip = mk('clipPath', { id: 'sd-clip' });
    clip.appendChild(mk('rect', { x: 0, y: 0, width: size, height: size }));
    g2.appendChild(clip);
    g2.appendChild(mk('rect', { x: 0, y: 0, width: size, height: size, fill: 'none', stroke: AXIS }));
    const inner = mk('g', { 'clip-path': 'url(#sd-clip)' });
    g2.appendChild(inner);
    // sum and difference directions through the truth
    inner.appendChild(mk('line', { x1: bx(B1 - 2), y1: by(B2 + 2), x2: bx(B1 + 2), y2: by(B2 - 2), stroke: GRID, 'stroke-width': 1 }));
    inner.appendChild(mk('line', { x1: bx(B1 - 2), y1: by(B2 - 2), x2: bx(B1 + 2), y2: by(B2 + 2), stroke: GRID, 'stroke-width': 1 }));
    // theoretical 95% ellipse: axes along (1,1) and (1,-1) with sds seSum/sqrt2 and seDiff/sqrt2
    const k = Math.sqrt(5.991), a = k * th.seSum / Math.SQRT2, b = k * th.seDiff / Math.SQRT2;
    const pts = [];
    for (let i = 0; i <= 120; i++) {
      const t = (2 * Math.PI * i) / 120, u = a * Math.cos(t), v = b * Math.sin(t);
      pts.push(`${bx(B1 + (u + v) / Math.SQRT2)},${by(B2 + (u - v) / Math.SQRT2)}`);
    }
    inner.appendChild(mk('polygon', { points: pts.join(' '), fill: GOLD, 'fill-opacity': 0.08, stroke: GOLD, 'stroke-width': 1.6, 'stroke-dasharray': '5,3' }));
    est.forEach((e, i) => inner.appendChild(mk('circle', {
      cx: bx(e.b1), cy: by(e.b2), r: i === est.length - 1 ? 4.5 : 2.3,
      fill: i === est.length - 1 ? RUST : DATA, opacity: i === est.length - 1 ? 1 : 0.45,
    })));
    inner.appendChild(mk('path', { d: `M${bx(B1) - 6},${by(B2)}h12M${bx(B1)},${by(B2) - 6}v12`, stroke: '#2b2e27', 'stroke-width': 1.6 }));
    [B1 - 1, B1, B1 + 1].forEach((v) => text(g2, bx(v), size + 15, v.toFixed(1), { 'font-size': 13 }));
    [B2 - 1, B2, B2 + 1].forEach((v) => text(g2, -16, by(v) + 4, v.toFixed(1), { 'font-size': 13 }));
    text(g2, size / 2, size + 32, 'β̂₁');
    text(g2, -30, size / 2 - 10, 'β̂₂');
    text(g2, size / 2, -6, 'estimates, all replicates', { 'font-size': 15, fill: '#3a3a34' });

    // ---------- panel 3: histogram of b1_hat on the same horizontal scale ----------
    const g3 = mk('g', { transform: `translate(${left3},${top})` });
    chart.appendChild(g3);
    const hx = (v) => ((v - (B1 - RANGE)) / (2 * RANGE)) * w3;
    const nb = 30, bw = (2 * RANGE) / nb, counts = new Array(nb).fill(0);
    est.forEach((e) => { const j = Math.floor((e.b1 - (B1 - RANGE)) / bw); if (j >= 0 && j < nb) counts[j] += 1; });
    const dens = counts.map((c) => (est.length ? c / (est.length * bw) : 0));
    const peak = NotesUtils.normalPdf(B1, B1, th.se1);
    const yMax = Math.max(peak, ...dens) * 1.1;
    const hy = (d) => size - (d / yMax) * size;
    g3.appendChild(mk('line', { x1: 0, y1: size, x2: w3, y2: size, stroke: AXIS }));
    dens.forEach((d, j) => {
      if (d > 0) g3.appendChild(mk('rect', { x: hx(B1 - RANGE + j * bw) + 0.5, y: hy(d), width: Math.max(hx(B1 - RANGE + bw) - hx(B1 - RANGE) - 1, 0.5), height: size - hy(d), fill: DATA, opacity: 0.7 }));
    });
    const curve = [];
    for (let i = 0; i <= 160; i++) { const v = B1 - RANGE + (2 * RANGE * i) / 160; curve.push(`${hx(v)},${hy(NotesUtils.normalPdf(v, B1, th.se1))}`); }
    g3.appendChild(mk('polyline', { points: curve.join(' '), fill: 'none', stroke: GOLD, 'stroke-width': 1.8, 'stroke-dasharray': '5,3' }));
    g3.appendChild(mk('line', { x1: hx(B1), y1: 0, x2: hx(B1), y2: size, stroke: '#2b2e27', 'stroke-width': 0.8 }));
    [B1 - 1, B1, B1 + 1].forEach((v) => text(g3, hx(v), size + 15, v.toFixed(1), { 'font-size': 13 }));
    text(g3, w3 / 2, size + 32, 'β̂₁');
    text(g3, w3 / 2, -6, 'histogram of β̂₁', { 'font-size': 15, fill: '#3a3a34' });

    // ---------- readouts: simulated (formula) ----------
    const sd = (arr) => Math.sqrt(NotesUtils.variance(arr));
    const fmt = (sim, thr) => (est.length > 2 ? `${sim.toFixed(3)} (formula ${thr.toFixed(3)})` : `— (formula ${thr.toFixed(3)})`);
    document.getElementById('sd-count').textContent = est.length;
    document.getElementById('sd-se1').textContent = fmt(sd(est.map((e) => e.b1)), th.se1);
    document.getElementById('sd-sesum').textContent = fmt(sd(est.map((e) => e.b1 + e.b2)), th.seSum);
    document.getElementById('sd-sediff').textContent = fmt(sd(est.map((e) => e.b1 - e.b2)), th.seDiff);
  }

  function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.textContent = 'Play'; } }
  playBtn.addEventListener('click', () => {
    if (timer) { stop(); return; }
    playBtn.textContent = 'Pause';
    timer = setInterval(() => { addReplicate(); render(); if (est.length >= 2000) stop(); }, 80);
  });
  document.getElementById('sd-add').addEventListener('click', () => { for (let i = 0; i < 100; i++) addReplicate(); render(); });
  document.getElementById('sd-reset').addEventListener('click', () => { stop(); est = []; lastX = null; render(); });
  [rhoSlider, nSlider].forEach((s) => s.addEventListener('input', () => {
    document.getElementById('sd-rho-val').textContent = rho().toFixed(2);
    document.getElementById('sd-n-val').textContent = N();
    est = []; addReplicate(); render();
  }));

  addReplicate();
  render();
})();
</script>
